name: CI / CD Pipeline

on:
    push:
        branches: [main, master, develop]
    pull_request:
        branches: [main, master]

jobs:
    quality-and-test:
        name: Code Quality & Automated Tests
        runs-on: ubuntu-latest

        env:
            DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
            DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
            NEXT_PUBLIC_APP_URL: "http://localhost:3000"
            BETTER_AUTH_SECRET: "ci-test-secret-key-at-least-32-characters-long"

        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v4

            - name: 🟢 Setup Node.js 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: 📦 Install pnpm
              run: npm install -g pnpm@9

            - name: ⚡ Get pnpm store directory
              id: pnpm-cache
              shell: bash
              run: |
                  echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

            - name: ⚡ Setup pnpm cache
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: 📦 Install dependencies
              run: pnpm install --frozen-lockfile

            - name: 🗄️ Generate Prisma Client
              run: pnpm exec prisma generate

            - name: 🩺 Check Database Health
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL || env.DATABASE_URL }}
              run: node scripts/check-db-health.mjs

            - name: ✨ Check Code Formatting (Prettier)
              run: pnpm format:check

            - name: 🔍 Run Linter (ESLint)
              run: pnpm lint

            - name: 🏷️ Run Type Check (TypeScript)
              run: pnpm type-check

            - name: 🧪 Run Automated Tests (Vitest)
              run: pnpm test

            - name: 🏗️ Test Production Build
              run: pnpm build
